name: NorthStar
options:
  bundleIdPrefix: com.dexterjackson.northstarpromise
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

# All business logic lives in Packages/*; targets below are thin SwiftUI shells
# that depend on those local packages. See CLAUDE.md §3.
packages:
  NSPCore:
    path: Packages/NSPCore
  NSPPersistence:
    path: Packages/NSPPersistence
  NSPPolicy:
    path: Packages/NSPPolicy
  NSPMedia:
    path: Packages/NSPMedia
  NSPTransfer:
    path: Packages/NSPTransfer
  NSPSync:
    path: Packages/NSPSync
  NSPIntelligence:
    path: Packages/NSPIntelligence
  NSPBackendClient:
    path: Packages/NSPBackendClient
  NSPActions:
    path: Packages/NSPActions
  NSPDesignSystem:
    path: Packages/NSPDesignSystem
  NSPTestSupport:
    path: Packages/NSPTestSupport

targets:
  NorthStarPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/Phone
      - path: App/Shared
    info:
      path: App/Phone/Info.plist
      properties:
        UILaunchScreen: {}
        # Required for `Activity.request` to actually surface anything —
        # without this, the Lock Screen/Dynamic Island Live Activity
        # request silently no-ops even with the entry point built.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets a capture session's AVAudioSession stay active — and its
        # AVAudioEngine tap keep delivering buffers — once the screen locks
        # or the app backgrounds, matching Voice Memos (2026-08-22). Closes
        # the gap `NSP-149`/`NSP-163` both flagged as their own open risk.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: >-
          North-Star Promise records meeting audio you start from Today so it can transcribe and summarize it,
          and — only while you've turned on Ambient Mode — listens for action items and reminders without
          recording anything.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          North-Star Promise can add a calendar event for a recording after it ends, if you turn that on in
          Settings.
        NSCalendarsFullAccessUsageDescription: >-
          North-Star Promise can show your calendar events so you can turn one into a scheduled recording.
        NSSpeechRecognitionUsageDescription: >-
          North-Star Promise transcribes your recordings on this device so it can generate a summary and action
          items, and — only while Ambient Mode is on — recognizes speech on-device to suggest action items
          without keeping a recording or transcript.
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.dexterjackson.northstarpromise.phone
    dependencies:
      - package: NSPCore
      - package: NSPPersistence
      - package: NSPPolicy
      - package: NSPMedia
      - package: NSPTransfer
      - package: NSPSync
      - package: NSPIntelligence
      - package: NSPBackendClient
      - package: NSPActions
      - package: NSPDesignSystem
      - target: NorthStarWatch
      - target: NorthStarWidgets

  NorthStarPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AppTests/Phone
    dependencies:
      - target: NorthStarPhone
      - package: NSPTestSupport

  NorthStarWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: App/Watch
    info:
      path: App/Watch/Info.plist
      properties:
        UILaunchScreen: {}
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.dexterjackson.northstarpromise.phone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dexterjackson.northstarpromise.phone.watchkitapp
        SKIP_INSTALL: NO
    dependencies:
      - package: NSPCore
      - package: NSPPersistence
      - package: NSPPolicy
      - package: NSPMedia
      - package: NSPTransfer
      - package: NSPDesignSystem

  NorthStarWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: AppTests/Watch
    dependencies:
      - target: NorthStarWatch
      - package: NSPTestSupport

  # The Lock Screen / Dynamic Island Live Activity that mirrors capture
  # state (docs/03 §2.2) — a pure *view*, per that section's own rule:
  # nothing here can start, stop, or otherwise affect a recording, it only
  # renders what `App/Phone/CaptureActivityController.swift` publishes.
  NorthStarWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/Widgets
      - path: App/Shared
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: NorthStarWidgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.dexterjackson.northstarpromise.phone.widgets
        SKIP_INSTALL: NO

schemes:
  NorthStarPhone:
    build:
      targets:
        NorthStarPhone: all
        NorthStarWidgets: all
        NorthStarPhoneTests: [test]
    test:
      targets:
        - NorthStarPhoneTests
  NorthStarWatch:
    build:
      targets:
        NorthStarWatch: all
        NorthStarWatchTests: [test]
    test:
      targets:
        - NorthStarWatchTests
